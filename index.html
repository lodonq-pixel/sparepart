<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toko Sparepart Alat Berat</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/main.css">
<link rel="icon" href="assets/images/logo-transparant.png" type="image/x-icon">
<link rel="shortcut icon" href="assets/images/logo-transparant.png" type="image/x-icon">
<link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
</head>
<body>

<div id="navbar"></div>
<div id="hero"></div>

<section class="catalog-container" id="katalog">

  <div class="catalog-header d-flex justify-content-between align-items-center mb-4">
    <h2 style="font-weight:800;color:var(--dark-bg);margin:0;">
      KATALOG SPAREPART
    </h2>
    <div class="d-flex align-items-center" style="gap: 15px;">
      <div class="search-container">
        <input type="text" id="searchProduk" class="form-control" placeholder="Cari produk..." />
      </div>
      <button class="btn-filter position-relative" data-bs-toggle="modal" data-bs-target="#filterModal">
        <i class="fas fa-sliders-h"></i>
        <span>Filter</span>
        <span id="filterBadge" class="filter-badge d-none"></span>
      </button>
    </div>
  </div>

  <div class="container my-3">

    <div id="filter-bar"></div>
    <div id="filterDialog"></div>

    <div id="loader" class="text-center my-4" style="display: none;">
      <div class="spinner-border text-warning" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <span class="ms-2">Memuat produk...</span>
    </div>

    <div class="row g-3" id="product-grid"></div>

  </div>
</section>

<!-- FOOTER -->
<div id="contact-footer"></div>

<script type="module" src="assets/js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>
</body>
</html>
