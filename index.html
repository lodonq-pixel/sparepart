<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Toko Sparepart Alat Berat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card img { height: 180px; object-fit: cover; }
    </style>
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand">🚜 Sparepart Alat Berat</span>
</nav>

<div class="container my-4">
    <div class="row" id="produk"></div>
</div>

<script src="js/script.js"></script>
<script>
    const PATH = "https://script.google.com/macros/s/AKfycbyNuM2rlMKRrvTaUHZEvZCFOLbg1TAcdnrAPCxnIoq75GFSOi5rJ-DfUlP8iFpT6DGnQA/exec";
    const API = PATH + "?type=produk";
    const WA = "628998765974"; // nomor WA admin

    function formatCurrency(number) {
        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number);
    }

    fetch(API)
        .then(res => res.json())
        .then(data => {
            const container = document.getElementById("produk");

            data.forEach(p => {
                const pesan = encodeURIComponent(
                    `Halo admin,
Saya ingin pesan:
${p.nama}
Harga: ${formatCurrency(p.harga)}
Mohon info ketersediaan.`
                );

                container.innerHTML += `
    <div class="col-md-3 mb-4">
      <div class="card h-100">
        <img src="${p.gambar}" alt="">
        <div class="card-body">
          <h6>${p.nama}</h6>
          <p class="text-danger fw-bold">${formatCurrency(p.harga)}</p>
          <p>Stok: ${p.stok}</p>
          <a target="_blank"
             href="https://wa.me/${WA}?text=${pesan}"
             class="btn btn-success w-100">
             Order WhatsApp
          </a>
        </div>
      </div>
    </div>`;
            });
        });
</script>

</body>
</html>
