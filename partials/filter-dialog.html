<div class="modal fade" id="filterModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h6 class="modal-title">Filter Produk</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label small">Kategori</label>
                    <select id="filterKategori" class="form-select form-select-sm">
                        <option value="">Semua Kategori</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label small">Harga Dari</label>
                    <input id="priceFrom" type="number"
                           class="form-control form-control-sm">
                </div>

                <div>
                    <label class="form-label small">Harga Sampai</label>
                    <input id="priceTo" type="number"
                           class="form-control form-control-sm">
                </div>
            </div>

            <div class="modal-footer">
                <button id="resetFilter" class="btn btn-light btn-sm">Reset</button>
                <button id="applyFilter"
                        class="btn btn-dark btn-sm"
                        data-bs-dismiss="modal">
                    Terapkan
                </button>
            </div>

        </div>
    </div>
</div>
